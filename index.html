<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>WU-TANG</title>
</head>
<body>
    <h1>WU-TANG, WU-TANG</h1>

    <p>Fill out these questions to generate your WU-TANG name!</p>
    
    <div>
        <p>What’s your vibe?</p>
        <input type="radio" id="chill" name="vibe" value="chill"> <label>chill</label>
        <input type="radio" id="spontaneous" name="vibe" value="spontaneous"> <label>spontanteous</label>
        <input type="radio" id="mysterious" name="vibe" value="mysterious"> <label>mysterious</label>
    </div>
    <div>
        <p>If you had a superpower, what would it be?</p>
        <input type="radio" id="mindreader" name="superpower" value="mindreader"> <label>mindreader</label>
        <input type="radio" id="teleport" name="superpower" value="teleport"> <label>teleport</label>
        <input type="radio" id="invisibility" name="superpower" value="invisibility"> <label>invisibility</label>
    </div>
    <div>
        <p>If you had to choose a spirit animal, what would it be?</p>
        <input type="radio" id="bunny" name="animal" value="bunny"> <label>bunny</label>
        <input type="radio" id="tiger" name="animal" value="tiger"> <label>tiger</label>
        <input type="radio" id="bear" name="animal" value="bear"> <label>bear</label>
    </div>
    <div>
        <p>What wouuld be your rap style?</p>
        <input type="radio" id="storyteller" name="rap" value="storyteller"> <label>storyteller</label>
        <input type="radio" id="freestyle" name="rap" value="freestyle"> <label>freestyle</label>
        <input type="radio" id="battle" name="rap" value="battle"> <label>battle</label>
    </div>
    <div>
        <p>Do you move in silence, make an entrance, or stay out the way?</p>
        <input type="radio" id="silence" name="move" value="moves in silence"> <label>silence</label>
        <input type="radio" id="make an entrance" name="move" value="make an entrance"> <label>make an entrance</label>
        <input type="radio" id="stay out the way" name="move" value="stay out the way"> <label>stay out the way</label>
    </div>

    <button>Find out my WU-TANG name.</button>

    <h2 id="displayName"></h2>
    
    <script type="text/javascript" src="main.js"></script> 
</body>
</html>
